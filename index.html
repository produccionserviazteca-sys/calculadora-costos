<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Distribuidores - Registro de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { border-radius: 16px; border: none; }
        .brand-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            border-radius: 16px 16px 0 0;
            padding: 25px;
            text-align: center;
        }
        .btn-submit {
            background-color: #0ea5e9;
            border: none;
            font-weight: 600;
            padding: 12px;
            transition: all 0.2s ease;
        }
        .btn-submit:hover { background-color: #0284c7; }
        .btn-regresar {
            display: inline-flex; align-items: center; background-color: #475569; color: white; padding: 8px 16px;
            border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem;
        }
        .btn-regresar:hover { background-color: #334155; color: white; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">
    
    <a href="index.html" class="btn-regresar">⬅️ Volver al Panel</a>

    <div class="card shadow-sm">
        <div class="brand-header">
            <h3 class="mb-1">🚚 Portal de Distribuidores</h3>
            <p class="mb-0 small text-white-50">Registro Oficial de Ventas y Colocación de Producto</p>
        </div>

        <div class="card-body p-4">
            <form id="formDistribuidor" onsubmit="enviarVentaDistribuidor(event)">
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Ruta / Nombre del Distribuidor</label>
                    <select id="distribuidorId" class="form-select" required>
                        <option value="" selected disabled>Selecciona tu Ruta...</option>
                        <option value="Distribuidor Norte - Ruta 1">Distribuidor Norte - Ruta 1</option>
                        <option value="Distribuidor Sur - Ruta 2">Distribuidor Sur - Ruta 2</option>
                        <option value="Distribuidor Centro - Ruta 3">Distribuidor Centro - Ruta 3</option>
                        <option value="Foráneo - Ruta 4">Foráneo - Ruta 4</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Producto Colocado</label>
                    <select id="productoVendido" class="form-select" required>
                        <option value="" selected disabled>Selecciona el producto...</option>
                        <option value="Papel Higiénico (Pack 4)">Papel Higiénico (Pack 4)</option>
                        <option value="Papel Higiénico (Industrial)">Papel Higiénico (Industrial)</option>
                        <option value="Servilletas (Paquete 50u)">Servilletas (Paquete 50u)</option>
                        <option value="Servilletas (Cocktail)">Servilletas (Cocktail)</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Cantidad Entregada (Paquetes/Bultos)</label>
                    <input type="number" id="cantidadVendida" class="form-control" placeholder="Ej. 50" min="1" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">Establecimiento / Cliente Destino</label>
                    <input type="text" id="clienteDestino" class="form-control" placeholder="Ej. Tienda La Principal o MiniSuper" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-submit text-white shadow-sm">
                    💾 Registrar y Reportar Venta
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // URL Única de tu Webhook limpia y vinculada a tu Apps Script
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxFF_4k9Thv-W9Q7H2tAPxuckuLcvb9fsfhnz9mKN7qd6Ylai_4fpn-lL3H9E2KDOxLzw/exec";

    function enviarVentaDistribuidor(event) {
        event.preventDefault(); // Previene que la página se recargue

        // Recopilación de los datos ingresados por el distribuidor externo
        const distribuidor = document.getElementById('distribuidorId').value;
        const producto = document.getElementById('productoVendido').value;
        const cantidad = document.getElementById('cantidadVendida').value;
        const cliente = document.getElementById('clienteDestino').value;

        // Estructura exacta con .sheet y .row para coincidir al 100% con tu backend de Google Apps Script
        const datosAPICorregidos = {
            sheet: "Ventas_Distribuidores", 
            row: [distribuidor, producto, cantidad, cliente] 
        };

        // Envío seguro de datos mediante POST a Google Apps Script
        fetch(WEBHOOK_URL, {
            method: "POST",
            mode: "no-cors", 
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datosAPICorregidos)
        })
        .then(() => {
            alert("¡Venta reportada con éxito a la administración de la planta!");
            document.getElementById('formDistribuidor').reset(); // Limpia el formulario para la siguiente venta
        })
        .catch(err => {
            alert("Error de conexión al reportar el registro: " + err);
        });
    }
</script>
</body>
</html>
