<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Calidad - Producto No Conforme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .btn-regresar {
            display: inline-flex; align-items: center; background-color: #0f172a; color: white; padding: 10px 18px;
            border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem;
            transition: background 0.2s ease; border: none;
        }
        .btn-regresar:hover { background-color: #3b82f6; color: white; }
        .btn-regresar::before { content: "⬅️"; margin-right: 8px; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="row mb-2">
            <div class="col"><a href="index.html" class="btn-regresar">Volver al Menú Principal</a></div>
        </div>

        <h2 class="mb-4 text-secondary border-bottom pb-2">Registro de Producto No Conforme (PNC)</h2>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow-sm p-3 mb-4">
                    <h5>Nuevo Registro</h5>
                    <div class="mb-2">
                        <label class="form-label small">Motivo del Defecto</label>
                        <select id="motivo" class="form-select">
                            <option>Mal corte</option>
                            <option>Mancha de aceite</option>
                            <option>Gramaje bajo</option>
                            <option>Empaque dañado</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Cantidad (Paquetes)</label>
                        <input type="number" id="cantidadPNC" class="form-control">
                    </div>
                    <button onclick="agregarRegistro()" class="btn btn-danger w-100">💾 Registrar Defecto en la Nube</button>
                </div>
            </div>
            
            <div class="col-md-8"><div class="card shadow-sm p-3"><canvas id="graficaPNC" style="max-height: 300px;"></canvas></div></div>
        </div>

        <div class="mt-4 card shadow-sm p-3">
            <h5>Historial de Incidencias (Local)</h5>
            <table class="table table-hover mt-2">
                <thead class="table-dark">
                    <tr><th>Fecha</th><th>Motivo</th><th>Cantidad</th><th>Estatus</th></tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxFF_4k9Thv-W9Q7H2tAPxuckuLcvb9fsfhnz9mKN7qd6Ylai_4fpn-lL3H9E2KDOxLzw/exec";
        const registros = [];
        const ctx = document.getElementById('graficaPNC').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Corte', 'Mancha', 'Gramaje', 'Empaque'], datasets: [{ label: 'Unidades Defectuosas', data: [0, 0, 0, 0], backgroundColor: '#dc3545' }] }
        });

        function agregarRegistro() {
            const motivo = document.getElementById('motivo').value;
            const cant = parseInt(document.getElementById('cantidadPNC').value);
            if(!cant) { alert("Ingresa una cantidad válida."); return; }

            const fecha = new Date().toLocaleDateString();

            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sheet: "PNC",
                    row: [motivo, cant, "Pendiente Revisión"]
                })
            }).then(() => {
                registros.push({fecha, motivo, cant});
                const fila = `<tr><td>${fecha}</td><td>${motivo}</td><td>${cant}</td><td><span class="badge bg-warning text-dark">Pendiente Revisión</span></td></tr>`;
                document.getElementById('tablaCuerpo').innerHTML += fila;

                chart.data.datasets[0].data[Math.floor(Math.random() * 4)] += cant;
                chart.update();
                alert("¡Falla registrada y enviada al control de calidad!");
            }).catch(err => alert("Error al conectar: " + err));
        }
    </script>
</body>
</html>
