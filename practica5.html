<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Etiquetas de Lote</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-regresar {
            display: inline-flex; align-items: center; background-color: #0f172a; color: white; padding: 10px 18px;
            border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem;
            transition: background 0.2s ease; border: none;
        }
        .btn-regresar:hover { background-color: #3b82f6; color: white; }
        .btn-regresar::before { content: "⬅️"; margin-right: 8px; }
        @media print { .no-print { display: none !important; } .etiqueta { border: 2px solid #000; padding: 20px; width: 100%; height: auto; } }
        .etiqueta { border: 2px dashed #ccc; padding: 30px; border-radius: 10px; background: white; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="no-print row mb-2">
            <div class="col"><a href="index.html" class="btn-regresar">Volver al Menú Principal</a></div>
        </div>

        <div class="row">
            <div class="col-md-4 no-print">
                <div class="card p-4 shadow-sm">
                    <h5>Datos del Lote</h5>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">Producto</label>
                        <input type="text" id="prodName" class="form-control" placeholder="P. Higiénico Hoja Doble">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Número de Lote</label>
                        <input type="text" id="loteNum" class="form-control" placeholder="L-2023-001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Máquina / Línea</label>
                        <input type="text" id="linea" class="form-control" placeholder="Línea de Corte 4">
                    </div>
                    <button onclick="guardarEtiqueta()" class="btn btn-primary w-100 mb-2">💾 Registrar Lote</button>
                    <button onclick="window.print()" class="btn btn-success w-100">🖨️ Imprimir Etiqueta</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="etiqueta text-center" id="areaEtiqueta">
                    <h1 class="display-4 fw-bold">ID DE PRODUCTION</h1>
                    <hr>
                    <div class="row text-start mt-4">
                        <div class="col-6"><p class="text-muted mb-0">PRODUCTO:</p><h3 id="outProd">Nombre del Producto</h3></div>
                        <div class="col-6"><p class="text-muted mb-0">LOTE:</p><h3 id="outLote">---</h3></div>
                    </div>
                    <div class="row text-start mt-4">
                        <div class="col-6"><p class="text-muted mb-0">FECHA DE EMISIÓN:</p><h3 id="outFecha">--/--/--</h3></div>
                        <div class="col-6"><p class="text-muted mb-0">LÍNEA:</p><h3 id="outLinea">---</h3></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Vinculada correctamente a tu Sheets
        const WEBHOOK_URL = "https://script.google.com/macros/s/1cyzm9ukW4kK3TSjpVexWXap3ceT8Tu6NWyPFLyez1cKSSbnI/exec";
        const inputs = ['prodName', 'loteNum', 'linea'];
        const outputs = ['outProd', 'outLote', 'outLinea'];

        inputs.forEach((id, index) => {
            document.getElementById(id).addEventListener('input', (e) => {
                document.getElementById(outputs[index]).innerText = e.target.value.toUpperCase();
            });
        });
        document.getElementById('outFecha').innerText = new Date().toLocaleDateString();

        function guardarEtiqueta() {
            const prod = document.getElementById('prodName').value;
            const lote = document.getElementById('loteNum').value;
            const lin = document.getElementById('linea').value;

            if(!prod || !lote) { alert("Llena los campos obligatorios del lote."); return; }

            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ sheet: "Etiquetas", row: [prod, lote, lin] })
            }).then(() => alert("¡Lote registrado en la nube!"))
              .catch(err => alert("Error: " + err));
        }
    </script>
</body>
</html>
