<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Rendimiento - Planta Papelera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-box { background-color: #e9ecef; border-left: 5px solid #0d6efd; }
        
        .btn-regresar {
            display: inline-flex; align-items: center; background-color: #0f172a; color: white; padding: 10px 18px;
            border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem;
            transition: background 0.2s ease; border: none;
        }
        .btn-regresar:hover { background-color: #3b82f6; color: white; }
        .btn-regresar::before { content: "⬅️"; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center mb-2">
            <div class="col-md-6"><a href="index.html" class="btn-regresar">Volver al Menú Principal</a></div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-primary mb-4 text-center">Calculadora de Rendimiento</h3>
                    <form id="calcForm">
                        <div class="mb-3">
                            <label class="form-label">Peso de la Bobina Jumbo (kg)</label>
                            <input type="number" id="pesoBobina" class="form-control" placeholder="Ej. 500" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Producto</label>
                            <select id="tipoProducto" class="form-select">
                                <option value="0.250">Servilleta Económica (250g/paquete)</option>
                                <option value="0.400">Servilleta Premium (400g/paquete)</option>
                                <option value="0.180">Papel Higiénico Sencillo (180g/rollo)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-2">Calcular Producción Estimada</button>
                        <button type="button" onclick="salvarRendimiento()" class="btn btn-success w-100">💾 Guardar Reporte en la Nube</button>
                    </form>

                    <div id="resultado" class="mt-4 p-3 result-box d-none">
                        <h5 class="mb-1">Producción Total:</h5>
                        <p id="textoResultado" class="h4 mb-0 font-monospace"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz4FgV-LZdS4irwUSaDZK6eYUTG-lG4-0LgES2bOLoyIRT_pBOXSaiw7vv5ganIaLGe/exec";
        let calculoUltimo = 0;

        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const peso = parseFloat(document.getElementById('pesoBobina').value);
            const factor = parseFloat(document.getElementById('tipoProducto').value);
            calculoUltimo = Math.floor((peso * 0.98) / factor);
            
            document.getElementById('textoResultado').innerText = `${calculoUltimo.toLocaleString()} unidades apróx.`;
            document.getElementById('resultado').classList.remove('d-none');
        });

        function salvarRendimiento() {
            const peso = document.getElementById('pesoBobina').value;
            const productoSelect = document.getElementById('tipoProducto');
            const productoTexto = productoSelect.options[productoSelect.selectedIndex].text;

            if(!peso || calculoUltimo === 0) { alert("Primero realiza un cálculo técnico."); return; }

            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    sheet: "Rendimiento",
                    row: [peso, productoTexto, calculoUltimo]
                })
            }).then(() => { alert("¡Rendimiento guardado en la base de datos!"); })
              .catch(err => alert("Error de conexión: " + err));
        }
    </script>
</body>
</html>
