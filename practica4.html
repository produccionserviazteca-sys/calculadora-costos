<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Rendimiento - Planta Papelera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .result-box { background-color: #e9ecef; border-left: 5px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h3 class="text-primary mb-4 text-center">Calculadora de Rendimiento</h3>
                    <form id="calcForm">
                        <div class="mb-3">
                            <label class="form-label">Peso de la Bobina Jumbo (kg)</label>
                            <input type="number" id="pesoBobina" class="form-control" placeholder="Ej. 500" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Producto</label>
                            <select id="tipoProducto" class="form-select">
                                <option value="0.250">Servilleta Económica (250g/paquete)</option>
                                <option value="0.400">Servilleta Premium (400g/paquete)</option>
                                <option value="0.180">Papel Higiénico Sencillo (180g/rollo)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Calcular Producción Estimada</button>
                    </form>

                    <div id="resultado" class="mt-4 p-3 result-box d-none">
                        <h5 class="mb-1">Producción Total:</h5>
                        <p id="textoResultado" class="h4 mb-0 font-monospace"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('calcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const peso = parseFloat(document.getElementById('pesoBobina').value);
            const factor = parseFloat(document.getElementById('tipoProducto').value);
            
            // Lógica: Peso total / peso por unidad (restando 2% de merma técnica)
            const unidades = Math.floor((peso * 0.98) / factor);
            
            const resDiv = document.getElementById('resultado');
            document.getElementById('textoResultado').innerText = `${unidades.toLocaleString()} unidades apróx.`;
            resDiv.classList.remove('d-none');
        });
    </script>
</body>
</html>
